version: '3.8'

services:
  peer-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-peer-1
    hostname: peer-1
    command: ["--host", "peer-1", "--port", "8001", "--hostfile", "/app/runs/hostfile.txt", "--fanout", "2", "--timeout", "6.0", "--config", "/app/CivicMesh/config/config.yaml", "--metrics-enabled", "--metrics-dominio", "unknown"]
    environment:
      - CIVICMESH_RUNS=/app/runs
      - CIVICMESH_RUN_ID=local-test
    volumes:
      - ./runs:/app/runs
    networks:
      - civicmesh-net
    ports:
      - "8001:8001"
    restart: unless-stopped

  peer-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-peer-2
    hostname: peer-2
    command: ["--host", "peer-2", "--port", "8002", "--hostfile", "/app/runs/hostfile.txt", "--fanout", "2", "--timeout", "6.0", "--config", "/app/CivicMesh/config/config.yaml", "--metrics-enabled", "--metrics-dominio", "unknown"]
    environment:
      - CIVICMESH_RUNS=/app/runs
      - CIVICMESH_RUN_ID=local-test
    volumes:
      - ./runs:/app/runs
    networks:
      - civicmesh-net
    ports:
      - "8002:8002"
    depends_on:
      - peer-1
    restart: unless-stopped

  peer-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-peer-3
    hostname: peer-3
    command: ["--host", "peer-3", "--port", "8003", "--hostfile", "/app/runs/hostfile.txt", "--fanout", "2", "--timeout", "6.0", "--config", "/app/CivicMesh/config/config.yaml", "--metrics-enabled", "--metrics-dominio", "unknown"]
    environment:
      - CIVICMESH_RUNS=/app/runs
      - CIVICMESH_RUN_ID=local-test
    volumes:
      - ./runs:/app/runs
    networks:
      - civicmesh-net
    ports:
      - "8003:8003"
    depends_on:
      - peer-1
    restart: unless-stopped

  publisher-air:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-publisher-air
    hostname: publisher-air
    entrypoint: ["python", "scripts/run_publisher.py"]
    command: ["--domain", "air_quality", "--comuna", "Las Condes", "--host", "publisher-air", "--port", "9001", "--hostfile", "/app/runs/hostfile.txt", "--interval", "2.0", "--config", "/app/CivicMesh/config/config.yaml", "--metrics-enabled"]
    environment:
      - CIVICMESH_RUNS=/app/runs
      - CIVICMESH_RUN_ID=local-test
    volumes:
      - ./runs:/app/runs
    networks:
      - civicmesh-net
    depends_on:
      - peer-1
      - peer-2
      - peer-3
    restart: unless-stopped

  publisher-crimes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-publisher-crimes
    hostname: publisher-crimes
    entrypoint: ["python", "scripts/run_publisher.py"]
    command: ["--domain", "crimes", "--comuna", "Santiago", "--host", "publisher-crimes", "--port", "9002", "--hostfile", "/app/runs/hostfile.txt", "--interval", "2.0", "--config", "/app/CivicMesh/config/config.yaml", "--metrics-enabled"]
    environment:
      - CIVICMESH_RUNS=/app/runs
      - CIVICMESH_RUN_ID=local-test
    volumes:
      - ./runs:/app/runs
    networks:
      - civicmesh-net
    depends_on:
      - peer-1
      - peer-2
      - peer-3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-frontend
    hostname: frontend
    entrypoint: ["streamlit", "run", "frontend/app.py", "--"]
    command: ["--metrics-dir", "/app/runs/local-test/metrics"]
    environment:
      - CIVICMESH_RUNS=/app/runs
    volumes:
      - ./runs:/app/runs
    networks:
      - civicmesh-net
    ports:
      - "8501:8501"
    depends_on:
      - peer-1
      - peer-2
      - peer-3
    restart: unless-stopped

networks:
  civicmesh-net:
    driver: bridge

# No named volumes - using bind mount ./runs:/app/runs