version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicmesh-test-runner
    entrypoint: ["pytest"]
    command: ["-v", "--tb=short"]
    environment:
      - PYTHONPATH=/app:/app/CivicMesh
    networks:
      - civicmesh-test-net

networks:
  civicmesh-test-net:
    driver: bridge
